<!DOCTYPE html>
<html lang="ja">
<head>
  <link rel="apple-touch-icon" href="roudoku-coach_icon_v5.png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>かたりの輪　朗読会</title>
<style>
  :root{
    --ink:#1f2a3d;
    --ink-soft:#5a6577;
    --paper:#f2f3f0;
    --card:#ffffff;
    --spine:#31456b;      /* 藍 */
    --accent:#b3402a;     /* 朱：神岡さんの背表紙 */
    --line:#d8dad4;
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:"Hiragino Mincho ProN","Yu Mincho","BIZ UDMincho",serif;
    background:var(--paper);color:var(--ink);min-height:100vh;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    padding:24px 18px 12px;border-bottom:1px solid var(--line);
    background:var(--paper);position:sticky;top:0;z-index:10;
  }
  h1{font-size:20px;font-weight:600;letter-spacing:.12em}
  .count{font-size:12px;color:var(--ink-soft);margin-top:4px;letter-spacing:.06em}
  .toolbar{display:flex;gap:8px;margin-top:12px}
  .search{
    flex:1;border:1px solid var(--line);border-radius:var(--radius);
    padding:9px 13px;font-size:16px;background:var(--card);
    font-family:inherit;color:var(--ink);outline:none;min-width:0;
  }
  .search:focus{border-color:var(--spine)}
  select.sort{
    border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);font-family:inherit;font-size:13px;
    padding:0 8px;color:var(--ink);outline:none;
  }
  .chips{
    display:flex;gap:7px;overflow-x:auto;margin-top:11px;padding-bottom:4px;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  .chips::-webkit-scrollbar{display:none}
  .chip{
    flex-shrink:0;border:1px solid var(--line);background:var(--card);
    color:var(--ink-soft);border-radius:20px;padding:6px 14px;
    font-size:13px;font-family:inherit;letter-spacing:.06em;
  }
  .chip.on{background:var(--spine);color:#fff;border-color:var(--spine)}
  main{padding:14px 14px 120px;max-width:560px;margin:0 auto}
  .session{margin-bottom:26px}
  .session-head{
    display:flex;align-items:baseline;gap:10px;
    padding:4px 4px 10px;
  }
  .session-date{font-size:15px;font-weight:600;letter-spacing:.08em}
  .session-theme{
    font-size:12px;color:var(--accent);letter-spacing:.06em;
    border:1px solid var(--accent);border-radius:12px;padding:2px 10px;
  }
  .card{
    display:flex;background:var(--card);border-radius:var(--radius);
    border:1px solid var(--line);margin-bottom:9px;overflow:hidden;
    box-shadow:0 1px 3px rgba(31,42,61,.05);
  }
  .spine{
    width:32px;background:var(--spine);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    writing-mode:vertical-rl;font-size:11px;letter-spacing:.2em;
    padding:8px 0;overflow:hidden;
  }
  .card.mine .spine{background:var(--accent)}
  .body{flex:1;padding:12px 12px 11px;min-width:0}
  .title{font-size:16px;font-weight:600;letter-spacing:.03em;line-height:1.5;word-break:break-word}
  .author{font-size:13px;color:var(--ink-soft);margin-top:4px;letter-spacing:.08em}
  .reader-line{font-size:12px;color:var(--spine);margin-top:5px;letter-spacing:.08em}
  .card.mine .reader-line{color:var(--accent)}
  .actions{display:flex;flex-direction:column;justify-content:center;gap:5px;padding:8px}
  .icon-btn{
    border:1px solid var(--line);background:var(--card);border-radius:9px;
    width:35px;height:35px;font-size:14px;color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{background:var(--paper)}
  .empty{text-align:center;color:var(--ink-soft);padding:60px 20px;line-height:2;font-size:14px}
  .fab{
    position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));
    width:56px;height:56px;border-radius:50%;border:none;
    background:var(--spine);color:#fff;font-size:28px;line-height:1;
    box-shadow:0 4px 14px rgba(31,42,61,.35);z-index:20;
  }
  .fab:active{transform:scale(.95)}
  .overlay{
    position:fixed;inset:0;background:rgba(31,42,61,.45);
    display:none;align-items:flex-end;justify-content:center;z-index:30;
  }
  .overlay.show{display:flex}
  .sheet{
    background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:20px 20px calc(22px + env(safe-area-inset-bottom));
  }
  .sheet h2{font-size:16px;letter-spacing:.1em;margin-bottom:14px;font-weight:600}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;color:var(--ink-soft);letter-spacing:.1em;margin-bottom:5px}
  .field input{
    width:100%;border:1px solid var(--line);border-radius:11px;
    padding:11px 13px;font-size:16px;font-family:inherit;color:var(--ink);
    background:var(--paper);outline:none;
  }
  .field input:focus{border-color:var(--spine);background:var(--card)}
  .sheet-btns{display:flex;gap:10px;margin-top:16px}
  .btn{flex:1;border:none;border-radius:11px;padding:13px;font-size:15px;font-family:inherit;letter-spacing:.08em}
  .btn.primary{background:var(--spine);color:#fff}
  .btn.ghost{background:var(--paper);color:var(--ink-soft);border:1px solid var(--line)}
  .btn:active{opacity:.85}
  footer{max-width:560px;margin:0 auto;padding:0 16px 8px;display:flex;gap:8px;justify-content:center}
  .link-btn{
    border:none;background:none;color:var(--ink-soft);font-size:12px;
    font-family:inherit;text-decoration:underline;letter-spacing:.06em;padding:6px;
  }
  .note{max-width:560px;margin:0 auto;padding:0 20px 16px;font-size:11px;color:var(--ink-soft);text-align:center}
  .toast{
    position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));
    transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 18px;border-radius:20px;font-size:13px;letter-spacing:.06em;
    opacity:0;transition:opacity .3s;pointer-events:none;z-index:40;white-space:nowrap;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>

<header>
  <h1>かたりの輪　朗読会</h1>
  <div class="count" id="count"></div>
  <div class="toolbar">
    <input class="search" id="search" type="search" placeholder="作品名・作者で検索">
    <select class="sort" id="sort">
      <option value="desc">新しい順</option>
      <option value="asc">古い順</option>
    </select>
  </div>
  <div class="chips" id="chips"></div>
</header>

<main><div id="list"></div></main>

<footer>
  <button class="link-btn" onclick="exportJSON()">書き出し（保存用）</button>
  <button class="link-btn" onclick="document.getElementById('importFile').click()">読み込み</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
</footer>
<div class="note">iPhoneのSafariで開くと、追加・編集した内容は端末に自動保存されます。</div>

<button class="fab" onclick="openSheet()" aria-label="作品を追加">＋</button>

<div class="overlay" id="overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet">
    <h2 id="sheetTitle">作品を追加</h2>
    <div class="field"><label>開催日</label><input id="inDate" type="date"></div>
    <div class="field"><label>読み手</label><input id="inReader" type="text" placeholder="例：神岡"></div>
    <div class="field"><label>作者</label><input id="inAuthor" type="text" placeholder="例：山本周五郎"></div>
    <div class="field"><label>作品名</label><input id="inTitle" type="text" placeholder="例：武家草鞋"></div>
    <div class="field"><label>テーマ（任意・その回の題）</label><input id="inTheme" type="text" placeholder="例：戦争をテーマに読む"></div>
    <div class="sheet-btns">
      <button class="btn ghost" onclick="closeSheet()">キャンセル</button>
      <button class="btn primary" onclick="saveEntry()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDate(d){
  const [y,m,day] = d.split('-');
  return `${y}年${+m}月${+day}日`;
}

function renderChips(){

  const el = document.getElementById('chips');
  el.innerHTML =
    `<button class="chip ${readerFilter==='all'?'on':''}" onclick="setFilter('all')">全員</button>` +
    readers.map(r=>`<button class="chip ${readerFilter===r?'on':''}" onclick="setFilter('${esc(r)}')">${esc(r)}</button>`).join('');
}

function setFilter(r){ readerFilter = r; renderChips(); render(); }

  document.getElementById('count').textContent =

    list.innerHTML = `<div class="empty">該当する作品がありません</div>`;
    return;
  }

  if(order === 'desc') dates.reverse();

    const g = groups[d];
    const theme = g.find(w=>w.theme)?.theme || '';
    return `
    <div class="session">
      <div class="session-head">
        <span class="session-date">${fmtDate(d)}</span>
        ${theme ? `<span class="session-theme">${esc(theme)}</span>` : ''}
      </div>
      ${g.map(w=>`
        <div class="card ${w.reader===ME?'mine':''}">
          <div class="spine">${esc(w.reader).slice(0,6)}</div>
          <div class="body">
            <div class="title">${esc(w.title)}</div>
            <div class="author">${esc(w.author)}</div>
            <div class="reader-line">読み手：${esc(w.reader)}</div>
          </div>
          <div class="actions">
            <button class="icon-btn" onclick="openSheet('${w.id}')" aria-label="編集">✎</button>
            <button class="icon-btn" onclick="removeEntry('${w.id}')" aria-label="削除">🗑</button>
          </div>
        </div>
      `).join('')}
    </div>`;
  }).join('');
}

function openSheet(id){
  editingId = id || null;
  document.getElementById('sheetTitle').textContent = id ? '作品を編集' : '作品を追加';
  const w = id ? works.find(x=>x.id===id) : null;
  document.getElementById('inDate').value = w ? w.date : new Date().toISOString().slice(0,10);
  document.getElementById('inReader').value = w ? w.reader : '';
  document.getElementById('inAuthor').value = w ? w.author : '';
  document.getElementById('inTitle').value = w ? w.title : '';
  document.getElementById('inTheme').value = w ? (w.theme||'') : '';
  document.getElementById('overlay').classList.add('show');
}

function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
  editingId = null;
}

function saveEntry(){
  const date = document.getElementById('inDate').value;
  const reader = document.getElementById('inReader').value.trim();
  const author = document.getElementById('inAuthor').value.trim();
  const title = document.getElementById('inTitle').value.trim();
  const theme = document.getElementById('inTheme').value.trim();
  if(!date){ toast('開催日を入力してください'); return; }
  if(!title){ toast('作品名を入力してください'); return; }
  if(editingId){
    const w = works.find(x=>x.id===editingId);
    if(w){ w.date=date; w.reader=reader||'（不明）'; w.author=author||'（作者不明）'; w.title=title; w.theme=theme; }
    toast('更新しました');
  }else{
    works.push({
      id:'u'+Date.now().toString(36),
      date, reader:reader||'（不明）', author:author||'（作者不明）', title, theme
    });
    toast('追加しました');
  }
  persist(); renderChips(); render(); closeSheet();
}

function removeEntry(id){
  const w = works.find(x=>x.id===id);
  if(!w) return;
  if(!confirm(`「${w.title}」（${w.reader}）を削除しますか？`)) return;
  works = works.filter(x=>x.id!==id);
  persist(); renderChips(); render(); toast('削除しました');
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(works,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'かたりの輪朗読会_作品集.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJSON(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error();
      works = data.filter(w=>w && w.title && w.date).map(w=>({
        id: w.id || 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
        date: String(w.date), reader: String(w.reader||'（不明）'),
        author: String(w.author||'（作者不明）'), title: String(w.title),
        theme: String(w.theme||'')
      }));
      persist(); renderChips(); render(); toast('読み込みました');
    }catch(e){ toast('ファイルを読み込めませんでした'); }
  };
  reader.readAsText(file);
  ev.target.value = '';
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),1800);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('sort').addEventListener('change', render);
renderChips();
render();
</script>
</body>
</html>
